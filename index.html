<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JET8 Inquiry Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-active { @apply border-b-2 border-blue-600 text-blue-600 font-bold; }
        .form-input { @apply mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50 p-2 border; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-black text-slate-900">JET8 INQUIRY</h1>
                <p class="text-slate-500 text-sm">Dashboard & Operational Tracking</p>
            </div>
            <button onclick="toggleModal('add-modal', true)" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-bold shadow-lg transition">
                + New Inquiry
            </button>
        </header>

        <nav class="flex space-x-8 border-b border-slate-200 mb-8 text-sm uppercase tracking-wider font-semibold">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="pb-4 tab-active">Dashboard</button>
            <button onclick="switchTab('list')" id="tab-list" class="pb-4 text-slate-400">Inquiry List</button>
            <button onclick="switchTab('settings')" id="tab-settings" class="pb-4 text-slate-400">Settings</button>
        </nav>

        <div id="dashboard-content"></div>
        <div id="list-content"></div>
    </div>

    <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-8 shadow-2xl">
            <h2 class="text-xl font-bold mb-6">บันทึกข้อมูล Inquiry ใหม่</h2>
            <form id="inquiry-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Subject Email</label>
                    <input type="text" id="subject_email" class="form-input" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Inquiry Date</label>
                    <input type="date" id="inquiry_date" class="form-input" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Network</label>
                    <select id="network_select" class="form-input"></select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Incoterms</label>
                    <select id="incoterms_select" class="form-input"></select>
                </div>
                <div class="md:col-span-2 flex justify-end gap-2 mt-6">
                    <button type="button" onclick="toggleModal('add-modal', false)" class="px-6 py-2 text-slate-400">ยกเลิก</button>
                    <button type="submit" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjrqhwcrsbiixtryglwx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DVnaODl92bfe_O42F1hM_A_ZYlVGYNh';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTab = 'dashboard';
        let optionsCache = { network: [], incoterms: [], status: [], staff: [] };

        // Helper: Calculate Day and Week
        function getDayAndWeek(dateStr) {
            if (!dateStr) return { day: '-', week: '-' };
            const d = new Date(dateStr);
            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const firstDay = new Date(d.getFullYear(), 0, 1);
            const week = Math.ceil((((d - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
            return { day: days[d.getDay()], week: week };
        }

        async function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active', 'text-blue-600'));
            document.getElementById('tab-'+tab).classList.add('tab-active', 'text-blue-600');
            fetchData();
        }

       async function loadOptions() {
    console.log("กำลังดึงข้อมูล Dropdown...");
    const { data, error } = await _supabase.from('dropdown_option').select('*');

    if (error) {
        console.error("ดึงข้อมูลตัวเลือกผิดพลาด:", error.message);
        return;
    }

    if (data) {
        console.log("ข้อมูลที่ดึงมาได้:", data);
        
        // ล้างค่าเก่าใน Cache
        optionsCache = { network: [], incoterms: [], status: [], staff: [] };
        
        // จัดหมวดหมู่ข้อมูล (เช็กให้ตรงกับในตาราง Supabase นะคะ)
        data.forEach(opt => {
            if (optionsCache[opt.category] !== undefined) {
                optionsCache[opt.category].push(opt.value);
            }
        });

        // แสดงผลใน Dropdown ของหน้า Add Modal
        const networkSelect = document.getElementById('network_select');
        const incotermsSelect = document.getElementById('incoterms_select');

        if (networkSelect) {
            networkSelect.innerHTML = optionsCache.network.length > 0 
                ? optionsCache.network.map(v => `<option value="${v}">${v}</option>`).join('')
                : '<option value="">-- ไม่มีข้อมูล Network --</option>';
        }

        if (incotermsSelect) {
            incotermsSelect.innerHTML = optionsCache.incoterms.length > 0 
                ? optionsCache.incoterms.map(v => `<option value="${v}">${v}</option>`).join('')
                : '<option value="">-- ไม่มีข้อมูล Incoterms --</option>';
        }
    }
}

async function fetchData() {
    console.log("กำลังเริ่มดึงข้อมูล...");
    try {
        const { data, error } = await _supabase
            .from('inquiry_list')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        console.log("ดึงข้อมูลสำเร็จ:", data);

        if (data) {
            renderDashboard(data);
            renderList(data);
        }
    } catch (err) {
        console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", err.message);
        const content = document.getElementById('list-content');
        if (content) content.innerHTML = `<p style="color:red;">โหลดข้อมูลไม่สำเร็จ: ${err.message}</p>`;
    }
}

        function renderDashboard(data) {
            const total = data.length;
            const won = data.filter(i => i.job_status === 'Won').length;
            const pending = data.filter(i => !i.sent).length;

            document.getElementById('dashboard-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-blue-500">
                        <p class="text-xs font-bold text-slate-400 uppercase">Total Inquiries</p>
                        <h2 class="text-4xl font-black">${total}</h2>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-yellow-500">
                        <p class="text-xs font-bold text-slate-400 uppercase">Waiting Quote</p>
                        <h2 class="text-4xl font-black text-yellow-500">${pending}</h2>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-green-500">
                        <p class="text-xs font-bold text-slate-400 uppercase">Jobs Won</p>
                        <h2 class="text-4xl font-black text-green-500">${won}</h2>
                    </div>
                </div>
                
            `;
        }

        function renderList(data) {
            document.getElementById('list-content').innerHTML = `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="p-4 text-xs font-bold text-slate-400 uppercase">Date / Day / Week</th>
                                <th class="p-4 text-xs font-bold text-slate-400 uppercase">Subject / Network</th>
                                <th class="p-4 text-xs font-bold text-slate-400 uppercase text-center">Sent</th>
                                <th class="p-4 text-xs font-bold text-slate-400 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(item => {
                                const info = getDayAndWeek(item.inquiry_date);
                                return `
                                <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                                    <td class="p-4">
                                        <div class="font-semibold text-slate-700">${item.inquiry_date || '-'}</div>
                                        <div class="text-[10px] text-slate-400 uppercase">${info.day} | Week ${info.week}</div>
                                    </td>
                                    <td class="p-4">
                                        <div class="font-bold text-blue-900">${item.subject_email}</div>
                                        <div class="text-xs text-slate-400">${item.network} | ${item.incoterms}</div>
                                    </td>
                                    <td class="p-4 text-center">
                                        <input type="checkbox" ${item.sent ? 'checked' : ''} class="w-5 h-5 accent-blue-600 pointer-events-none">
                                    </td>
                                    <td class="p-4">
                                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${item.job_status === 'Won' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}">
                                            ${item.job_status || 'Pending'}
                                        </span>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderSettings() {
            document.getElementById('main-content').innerHTML = `
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-6">Manage Dropdown Options</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-sm font-bold mb-2">เพิ่มตัวเลือกใหม่</label>
                            <div class="flex gap-2">
                                <select id="new-opt-cat" class="form-input w-1/3">
                                    <option value="network">Network</option>
                                    <option value="incoterms">Incoterms</option>
                                    <option value="status">Status</option>
                                </select>
                                <input type="text" id="new-opt-val" class="form-input" placeholder="ชื่อตัวเลือก...">
                                <button onclick="addOption()" class="bg-slate-800 text-white px-4 rounded-md">Add</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function addOption() {
    const cat = document.getElementById('new-opt-cat').value; // หมวดหมู่ที่เลือก (network/incoterms/status)
    const val = document.getElementById('new-opt-val').value; // ค่าที่พิมพ์ลงไป
    
    if(!val) {
        alert("กรุณาพิมพ์ชื่อตัวเลือกก่อนค่ะ");
        return;
    }

    const { error } = await _supabase
        .from('dropdown_option')
        .insert([{ category: cat, value: val }]);

    if(!error) {
        alert('เพิ่มตัวเลือก ' + val + ' ในหมวด ' + cat + ' เรียบร้อยค่ะ!');
        document.getElementById('new-opt-val').value = ''; // ล้างช่องพิมพ์
        loadOptions(); // โหลด Dropdown ใหม่ทันที
        fetchData();   // รีเฟรชหน้า Settings
    } else {
        alert('บันทึกไม่ได้: ' + error.message);
    }
}

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
            if(show) loadOptions();
        }

        document.getElementById('inquiry-form').onsubmit = async (e) => {
    e.preventDefault();
    
    const payload = {
        // ต้องสะกดตัวเล็กทั้งหมดให้ตรงกับใน Supabase นะคะ
        subject_email: document.getElementById('subject_email').value, 
        inquiry_date: document.getElementById('inquiry_date').value,
        network: document.getElementById('network_select').value,
        incoterms: document.getElementById('incoterms_select').value
        // ส่วน id ไม่ต้องใส่ในนี้ค่ะ เพราะ Supabase จะรันเลข 1, 2, 3 ให้เองอัตโนมัติ
    };

    console.log("กำลังจะส่งข้อมูล:", payload); // เอาไว้เช็กใน Console ว่าค่ามาครบไหม

    const { data, error } = await _supabase
        .from('inquiry_list')
        .insert([payload]);

    if(error) {
        console.error("บันทึกไม่สำเร็จ:", error);
        alert('เกิดข้อผิดพลาด: ' + error.message);
    } else {
        alert('บันทึกข้อมูลเรียบร้อยแล้วค่ะ!');
        toggleModal('add-modal', false); // ปิดหน้าต่างกรอกข้อมูล
        fetchData(); // โหลดตารางใหม่มาแสดงผล
    }
};

        // Initial Load
        loadOptions();
        fetchData();
    </script>
</body>
</html>
